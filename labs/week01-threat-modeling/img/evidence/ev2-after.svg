  <text x="450.0" y="27" fill="#8b949e" text-anchor="middle" font-size="11.5">Task 8 AFTER — fix on /upload (:8081) + Audit-the-AI check</text>
  <text x="16" y="80" fill="#7ee787">$&#160;printf&#160;&#x27;%s&#160;|&#160;%s&#160;|&#160;&#x27;&#160;&quot;$(whoami)&quot;&#160;&#x27;6631503092&#x27;;&#160;date&#160;&#x27;+%F&#160;%T&#160;%Z&#x27;</text><text x="16" y="97" fill="#79c0ff">thomas&#160;|&#160;6631503092&#160;|&#160;2026-08-15&#160;15:44:41&#160;+07</text><text x="16" y="114" fill="#c9d1d9"></text><text x="16" y="132" fill="#7ee787">$&#160;curl&#160;-s&#160;-X&#160;POST&#160;localhost:8081/upload&#160;-F&#160;&#x27;file=@demo.txt;filename=../pwned_after.txt&#x27;</text><text x="16" y="150" fill="#a5d6ff">{&quot;saved&quot;:&quot;pwned_after.txt&quot;}</text><text x="16" y="167" fill="#c9d1d9"></text><text x="16" y="184" fill="#c9d1d9"></text><text x="16" y="202" fill="#7ee787">$&#160;docker&#160;exec&#160;week01-threat-modeling-sample-app-1&#160;ls&#160;/app/pwned_after.txt</text><text x="16" y="220" fill="#ff7b72">ls:&#160;cannot&#160;access&#160;&#x27;/app/pwned_after.txt&#x27;:&#160;No&#160;such&#160;file&#160;or&#160;directory</text><text x="16" y="237" fill="#ffa657">&gt;&gt;&gt;&#160;escape&#160;BLOCKED&#160;—&#160;nothing&#160;written&#160;to&#160;/app</text><text x="16" y="254" fill="#c9d1d9"></text><text x="16" y="272" fill="#7ee787">$&#160;curl&#160;-s&#160;-X&#160;POST&#160;localhost:8081/upload&#160;-F&#160;&#x27;file=@demo.txt;filename=notes.txt&#x27;&#160;&#160;&#160;#&#160;legit</text><text x="16" y="290" fill="#a5d6ff">{&quot;saved&quot;:&quot;notes.txt&quot;}</text><text x="16" y="307" fill="#c9d1d9"></text><text x="16" y="324" fill="#c9d1d9"></text><text x="16" y="342" fill="#7ee787">$&#160;curl&#160;-s&#160;-X&#160;POST&#160;localhost:8081/upload&#160;-F&#160;&#x27;file=@demo.txt;filename=shell.php&#x27;&#160;&#160;&#160;&#160;#&#160;rejected</text><text x="16" y="360" fill="#ff7b72">{&quot;error&quot;:&quot;rejected&#160;filename&quot;}</text><text x="16" y="377" fill="#c9d1d9"></text><text x="16" y="394" fill="#c9d1d9"></text><text x="16" y="412" fill="#7ee787">$&#160;python3&#160;-c&#160;&quot;import&#160;os;&#160;print(os.path.join(&#x27;uploads&#x27;,&#x27;/etc/passwd&#x27;))&quot;&#160;&#160;#&#160;Audit-the-AI</text><text x="16" y="430" fill="#c9d1d9">/etc/passwd</text><text x="16" y="447" fill="#ffa657">&gt;&gt;&gt;&#160;absolute&#160;2nd&#160;arg&#160;discards&#160;the&#160;first&#160;—&#160;a&#160;&#x27;..&#x27;&#160;blocklist&#160;misses&#160;this</text>
