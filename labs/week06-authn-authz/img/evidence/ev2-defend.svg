<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" font-family="'Menlo','Courier New',monospace" font-size="13">
  <rect width="900" height="680" rx="10" fill="#1e1e2e"/>
  <rect x="0" y="0" width="900" height="32" rx="10" fill="#313244"/>
  <circle cx="20" cy="16" r="6" fill="#f38ba8"/><circle cx="38" cy="16" r="6" fill="#a6e3a1"/><circle cx="56" cy="16" r="6" fill="#f9e2af"/>
  <text x="450" y="20" fill="#cdd6f4" text-anchor="middle" font-size="12">Week 6 — Defense Evidence (solution_app.py)</text>

  <!-- Identity stamp -->
  <text x="15" y="56" fill="#a6e3a1">$ printf '%s | %s | ' "$(whoami)" '6631503092'; date '+%F %T %Z'</text>
  <text x="15" y="74" fill="#cdd6f4">thomas | 6631503092 | 2026-09-13 16:52:11 +07</text>

  <!-- Fresh token -->
  <text x="15" y="102" fill="#f9e2af">--- Fresh token from solution_app.py ---</text>
  <text x="15" y="120" fill="#a6e3a1">$ curl -s -X POST http://localhost:8080/login -d '{"user":"alice","pw":"alicepw"}'</text>
  <text x="15" y="138" fill="#cdd6f4">TOKEN=eyJ...eyJzdWIiOiJhbGljZSIsImF1ZCI6IndlZWswNi1sYWIiLCJleHAiOjE3ODky...}</text>
  <text x="15" y="156" fill="#585b70">  ↑ Token now includes aud:"week06-lab" + exp (15 min TTL)</text>

  <!-- Alice's own order OK -->
  <text x="15" y="184" fill="#a6e3a1">$ curl -s http://localhost:8080/api/orders/1 -H "Authorization: Bearer $TOKEN"</text>
  <text x="15" y="202" fill="#a6e3a1">{"item":"Laptop","owner":"alice","total":1200}  ✓ own order works</text>

  <!-- IDOR blocked -->
  <text x="15" y="236" fill="#f9e2af">--- IDOR: bob's order with alice's token ---</text>
  <text x="15" y="254" fill="#a6e3a1">$ curl -s http://localhost:8080/api/orders/2 -H "Authorization: Bearer $TOKEN"</text>
  <text x="15" y="272" fill="#a6e3a1">{"error":"forbidden"}  HTTP 403</text>
  <text x="15" y="290" fill="#585b70">  ↑ FIX: order["owner"] != user → 403 (solution_app.py L64)</text>

  <!-- alg:none rejected -->
  <text x="15" y="324" fill="#f9e2af">--- alg:none forged token (bob) ---</text>
  <text x="15" y="342" fill="#a6e3a1">$ curl -s http://localhost:8080/api/orders/2 -H "Authorization: Bearer $FORGED_NONE"</text>
  <text x="15" y="360" fill="#a6e3a1">{"error":"invalid token"}  HTTP 401</text>
  <text x="15" y="378" fill="#585b70">  ↑ FIX: algorithms=["HS256"] only, "none" rejected (L50)</text>

  <!-- weak secret rejected -->
  <text x="15" y="412" fill="#f9e2af">--- weak-secret forged token (bob) ---</text>
  <text x="15" y="430" fill="#a6e3a1">$ curl -s http://localhost:8080/api/orders/2 -H "Authorization: Bearer $FORGED_WEAK"</text>
  <text x="15" y="448" fill="#a6e3a1">{"error":"invalid token"}  HTTP 401</text>
  <text x="15" y="466" fill="#585b70">  ↑ FIX: secret is os.urandom(32).hex(), not "secret" (L10); aud required (L50)</text>

  <!-- old token rejected -->
  <text x="15" y="500" fill="#f9e2af">--- alice's OLD token (no exp/aud, signed with old secret) ---</text>
  <text x="15" y="518" fill="#a6e3a1">$ curl -s http://localhost:8080/api/orders/1 -H "Authorization: Bearer $OLD_TOKEN"</text>
  <text x="15" y="536" fill="#a6e3a1">{"error":"invalid token"}  HTTP 401</text>
  <text x="15" y="554" fill="#585b70">  ↑ FIX: tokens must carry valid exp + aud claims; require=["exp","aud"] (L50)</text>

  <!-- Summary -->
  <rect x="15" y="580" width="870" height="24" rx="4" fill="#313244"/>
  <text x="450" y="597" fill="#a6e3a1" text-anchor="middle" font-size="12">All 4 attacks BLOCKED: IDOR→403 | alg:none→401 | weak-secret→401 | missing claims→401</text>

  <!-- Fix summary table -->
  <text x="15" y="628" fill="#cdd6f4" font-size="11">Fixes: L10 strong random secret | L38-41 exp+aud in token | L50 algorithms=["HS256"],require=["exp","aud"]</text>
  <text x="15" y="648" fill="#cdd6f4" font-size="11">       L56-58 try/except InvalidTokenError→401 | L64 ownership check order["owner"]!=user→403</text>
  <text x="15" y="668" fill="#585b70" font-size="11">CWE-639 (IDOR) / CWE-347 (signature verification) / CWE-321 (hardcoded key) — all remediated</text>
</svg>
