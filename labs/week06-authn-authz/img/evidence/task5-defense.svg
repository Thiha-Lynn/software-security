  <text x="12" y="146" fill="#a6e3a1" font-size="12">$ curl -s /api/orders/1 → {"item":"Laptop","owner":"alice","total":1200}</text>
  <text x="12" y="163" fill="#a6e3a1" font-size="11">  ✓ Own order works fine</text>
